<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>千工具军火库 · 工具总目录</title>
<style>
:root {
  --bg: #f5f6f8; --card: #ffffff; --ink: #1c2433; --muted: #6b7280;
  --accent: #3b5bdb; --accent-soft: #eef1fd; --line: #e6e8ee;
  --radius: 14px; --mono: "JetBrains Mono", "Cascadia Code", Consolas, "Courier New", monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  background: var(--bg); color: var(--ink); line-height: 1.6;
}
.hero {
  background: linear-gradient(135deg, #1e2a52 0%, #3b5bdb 60%, #5f7ae8 100%);
  color: #fff; padding: 48px 24px 88px; text-align: center;
}
.hero h1 { font-size: 30px; letter-spacing: 2px; font-weight: 700; }
.hero .sub { margin-top: 10px; font-size: 14px; opacity: .82; }
.hero .stats { margin-top: 18px; display: flex; gap: 28px; justify-content: center; font-size: 14px; opacity: .9; flex-wrap: wrap; }
.hero .stats b { font-size: 20px; display: block; }
.wrap { max-width: 1240px; margin: -52px auto 0; padding: 0 24px 60px; }
.toolbar {
  position: sticky; top: 12px; z-index: 10;
  background: rgba(255,255,255,.92); backdrop-filter: blur(10px);
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 16px; box-shadow: 0 8px 24px rgba(28,36,51,.08);
}
.search-row { display: flex; gap: 12px; align-items: center; }
.search-box { position: relative; flex: 1; }
.search-box svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; stroke: var(--muted); }
.search-box input {
  width: 100%; padding: 11px 40px 11px 42px; font-size: 15px;
  border: 1.5px solid var(--line); border-radius: 10px; outline: none; color: var(--ink);
  background: #fafbfc; transition: border-color .15s, background .15s;
}
.search-box input:focus { border-color: var(--accent); background: #fff; }
.search-box .clear {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  border: none; background: none; font-size: 18px; color: var(--muted); cursor: pointer; padding: 4px 8px; display: none;
}
.search-box .clear:hover { color: var(--ink); }
.count { font-size: 13.5px; color: var(--muted); white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip {
  border: 1px solid var(--line); background: #fff; color: var(--ink);
  padding: 5px 13px; border-radius: 999px; font-size: 13px; cursor: pointer;
  transition: all .12s; user-select: none;
}
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip .n { opacity: .55; margin-left: 4px; font-size: 12px; }
.chip.active .n { opacity: .85; }
.grid {
  margin-top: 22px; display: grid; gap: 16px;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
}
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 10px;
  transition: transform .15s, box-shadow .15s, border-color .15s;
}
.card:hover { transform: translateY(-3px); box-shadow: 0 10px 26px rgba(28,36,51,.10); border-color: #d6dbe8; }
.card .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.card h3 { font-size: 16.5px; font-weight: 650; line-height: 1.4; }
.cat-tag {
  flex: none; font-size: 11.5px; color: var(--muted);
  background: var(--accent-soft); border-radius: 6px; padding: 3px 8px; white-space: nowrap;
}
.slug { font-family: var(--mono); font-size: 12px; color: var(--accent); background: #f3f5ff; border-radius: 6px; padding: 2px 8px; align-self: flex-start; }
.card .desc { font-size: 13.5px; color: #4b5563; min-height: 21px; }
.example { position: relative; }
.example pre {
  font-family: var(--mono); font-size: 12.3px; line-height: 1.65;
  background: #f6f7fa; border: 1px solid #eceef3; border-radius: 9px;
  padding: 10px 12px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; color: #333d52;
}
.example .copy {
  position: absolute; top: 7px; right: 7px; border: 1px solid var(--line); border-radius: 6px;
  background: #fff; color: var(--muted); font-size: 11.5px; padding: 2px 8px; cursor: pointer; opacity: 0; transition: opacity .15s;
}
.example:hover .copy { opacity: 1; }
.example .copy:hover { color: var(--accent); border-color: var(--accent); }
.example .copy.ok { color: #16a34a; border-color: #16a34a; opacity: 1; }
.no-example { font-size: 12.5px; color: #9aa2b1; font-style: italic; }
.empty { text-align: center; padding: 70px 0; color: var(--muted); font-size: 15px; grid-column: 1 / -1; }
.empty b { font-size: 40px; display: block; margin-bottom: 8px; }
footer { text-align: center; color: #9aa2b1; font-size: 12.5px; padding: 0 0 40px; }
@media (max-width: 640px) { .grid { grid-template-columns: 1fr; } .hero h1 { font-size: 24px; } }
</style>
</head>
<body>
<header class="hero">
  <h1>千工具军火库 · 工具总目录</h1>
  <div class="sub">单文件 Python 标准库命令行工具集 —— 搜索或按分类浏览，卡片附用法示例</div>
  <div class="stats" id="stats"></div>
</header>
<div class="wrap">
  <div class="toolbar">
    <div class="search-row">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="搜索工具：名称、slug、说明、示例…（按 / 聚焦，Esc 清空）" autocomplete="off">
        <button class="clear" id="clear" title="清空">×</button>
      </div>
      <span class="count" id="count"></span>
    </div>
    <div class="chips" id="chips"></div>
  </div>
  <main class="grid" id="grid"></main>
</div>
<footer id="foot"></footer>
<script id="tools-data" type="application/json">[{"slug":"abs-path-scan","name":"硬编码绝对路径扫描","summary":"硬编码绝对路径扫描（可移植性检查）。","examples":["python abs-path-scan.py src/ # 递归扫描目录","python abs-path-scan.py a.py config.yml --json # 扫描指定文件, JSON 输出"],"category":"系统与进程"},{"slug":"access-top-n","name":"访问TopN统计","summary":"从访问日志统计 Top N 的 IP、URL、User-Agent。","examples":["python access-top-n.py access.log","python access-top-n.py access.log -n 20"],"category":"数学与统计"},{"slug":"acrostic-poem","name":"藏头诗生成","summary":"给定藏头几个字，套用意象模板逐句生成藏头诗。","examples":["python acrostic-poem.py 春风得意","python acrostic-poem.py 中 秋 --seed 42"],"category":"终端与趣味"},{"slug":"adjacent-dedupe","name":"相邻重复行去重","summary":"删除相邻重复行、压缩重复空行。","examples":["python adjacent-dedupe.py input.txt -o output.txt --stats","python adjacent-dedupe.py input.txt --blank drop -o output.txt"],"category":"文本处理"},{"slug":"age-buckets","name":"按未修改天数分桶","summary":"按未修改天数分桶 (7 天/30 天/1 年…), 统计各桶文件数与占用空间。","examples":["python age-buckets.py K:/tmp","python age-buckets.py . --buckets \"7d,30d,1y\" --field atime"],"category":"日期时间"},{"slug":"age-calc","name":"精确年龄计算","summary":"周岁、虚岁、总天数，下次生日倒计时与星期几","examples":["python age-calc.py 1995-06-15 # 以今天为基准","python age-calc.py 2000-02-29 --at 2026-11-02 # 2月29日出生的特殊处理"],"category":"日期时间"},{"slug":"age-size-matrix","name":"文件年龄×大小矩阵","summary":"按\"最后修改时间距今的天数\"与\"文件大小\"两个维度对目录树做二维分桶","examples":["python age-size-matrix.py D:/data","python age-size-matrix.py D:/data --age-days 30,90,365 --size-buckets 1MB,10MB,100MB"],"category":"日期时间"},{"slug":"alarm-at","name":"定时提醒器","summary":"阻塞等待到指定时刻后打印消息并让终端响铃，支持相对时长写法。","examples":["python alarm-at.py +25m -m \"泡面好了\" # 相对时长: 支持 d/h/m/s 组合, 如 +1h30m","python alarm-at.py 90s # 不写 + 也按相对时长处理(纯数字按秒)"],"category":"日期时间"},{"slug":"alias-badge","name":"匿名代号牌","summary":"为匿名评审/匿名问卷批量生成不重复的\"颜色+动物\"代号表。","examples":["python alias-badge.py --count 20 # 生成 20 个代号","python alias-badge.py -n 8 --seed 42 # 固定种子，结果可复现"],"category":"终端与趣味"},{"slug":"align-columns","name":"文本列对齐","summary":"按分隔符把松散文本的各行对齐成整齐的列","examples":["printf 'id name 描述\\n1 alice 张三\\n2 bob 李四王五\\n' | python -I align-columns.py","python -I align-columns.py -d ',' -r 1 data.csv"],"category":"文本处理"},{"slug":"alloc-waste-meter","name":"簇分配浪费计量器","summary":"文件在磁盘上按\"分配簇（cluster / allocation unit）\"整块分配：哪怕只写 1 字节","examples":["python alloc-waste-meter.py C:/Users/me/logs","python alloc-waste-meter.py D:/data --top 20"],"category":"系统与进程"},{"slug":"amount-range-parse","name":"金额区间表述解析","summary":"金额区间表述解析","examples":["python -I amount-range-parse.py \"三到五万元\" \"十万上下\" \"不低于两万\"","python -I amount-range-parse.py --json \"超过八百\" \"3-5万\""],"category":"数学与统计"},{"slug":"anniversary","name":"周年纪念计算","summary":"计算事件发生以来的整周年/整月数，支持公历与农历纪念","examples":["python anniversary.py 2020-01-25 # 公历事件，以今天为基准","python anniversary.py 2015-10-01 --at 2026-11-02 # 指定基准日期"],"category":"日期时间"},{"slug":"ansi-strip","name":"ANSI 转义序列清除工具","summary":"ANSI 转义序列清除工具。","examples":["python ansi-strip.py -i colored.log -o clean.log","cat colored.log | python ansi-strip.py --list"],"category":"文本处理"},{"slug":"archive-inventory","name":"压缩包内容清单","summary":"扫描目录下的 zip / tar 系压缩包（.zip、.tar、.tar.gz/.tgz、","examples":["python archive-inventory.py .","python archive-inventory.py D:/dist --ext .jar --ext .whl"],"category":"压缩打包"},{"slug":"archive-rotator","name":"归档轮换清理","summary":"按数量或保留天数把旧文件移入归档目录或删除（如日志只留最近 10 份），支持预演","examples":["python archive-rotator.py logs/ --keep-count 10 -a archive/ # 预演：留最近10份","python archive-rotator.py logs/ --keep-count 10 -a archive/ --apply # 实际执行"],"category":"压缩打包"},{"slug":"ascii-banner-index","name":"分隔线目录生成","summary":"分隔线目录生成。","examples":["python ascii-banner-index.py notes.md # 打印目录到终端","python ascii-banner-index.py notes.md -o toc.txt # 目录另存为文件"],"category":"终端与趣味"},{"slug":"ascii-cat","name":"猫狗字符画","summary":"随机输出一只 ASCII 猫/狗/兔，支持心情变体。","examples":["python -I ascii-cat.py # 随机动物 + 随机心情","python -I ascii-cat.py --animal cat --mood happy --seed 3"],"category":"终端与趣味"},{"slug":"ascii-clock","name":"字符时钟","summary":"点阵大数字显示当前时间，可切换秒表模式。","examples":["python ascii-clock.py --once # 打印一帧当前时间后退出","python ascii-clock.py # 时钟模式持续刷新"],"category":"终端与趣味"},{"slug":"ascii-heart","name":"爱心函数","summary":"按心形隐函数 (x²+y²-1)³ - x²y³ < 0 打印 ASCII 爱心，可在中间嵌入祝福语。","examples":["python ascii-heart.py # 实心爱心（默认 20 行高）","python ascii-heart.py --mode curve --size 24 # 只描心形轮廓曲线"],"category":"终端与趣味"},{"slug":"ascii-motd","name":"每日一画","summary":"按日期做种子, 确定性输出一幅随机 ASCII 艺术画。","examples":["python ascii-motd # 输出今天的画","python ascii-motd --date 2026-11-03 # 指定日期"],"category":"终端与趣味"},{"slug":"ascii-rocket","name":"火箭发射","summary":"倒计时后火箭升空喷焰的逐帧动画。","examples":["python ascii-rocket.py # 默认 T-3 倒计时 + 24 帧","python ascii-rocket.py --countdown 5 --frames 40 --delay 0.2"],"category":"终端与趣味"},{"slug":"ascii-table","name":"ASCII 表格渲染","summary":"把 CSV/JSON 数据渲染成带边框对齐的终端表格","examples":["python ascii-table.py users.csv --align left","python ascii-table.py rows.jsonl"],"category":"终端与趣味"},{"slug":"aspect-ratio-match","name":"计算宽高比并匹配最接近的常见比例","summary":"计算宽高比并匹配最接近的常见比例","examples":["python aspect-ratio-match.py photo.jpg","python aspect-ratio-match.py screenshot.png --all"],"category":"数学与统计"},{"slug":"assert-outside-tests","name":"断言越界扫描","summary":"断言越界扫描（单文件，仅用 Python 标准库）。","examples":["python assert-outside-tests.py src/ # 递归扫描目录","python assert-outside-tests.py a.py lib/b.go # 扫描指定文件"],"category":"代码质量"},{"slug":"atime-lister","name":"按最后访问时间","summary":"按最后访问时间 (atime) 排序/筛选文件, 找出长期无人读取的文件。","examples":["python atime-lister.py K:/tmp --older-than 30 --limit 20","python atime-lister.py . --sort size --desc --summary"],"category":"文件与目录"},{"slug":"baby-age","name":"宝宝月龄计算","summary":"计算婴儿月龄天数，给出百天、周岁等关键日期","examples":["python baby-age.py 2026-06-15","python baby-age.py 2026-06-15 --at 2026-11-02"],"category":"日期时间"},{"slug":"backup-codes-gen","name":"2FA 恢复码生成","summary":"批量生成 xx-xxxx 格式的双因子恢复码(如 a3-9k2m)。","examples":["python backup-codes-ge thon yaml2json-lite.py data.yaml","python yaml2json-lite.py data.yaml -o out.json"],"category":"数据与表格"},{"slug":"year-progress","name":"年度进度显示","summary":"显示当前年度已过百分比的动态进度条，精确到日","examples":["python year-progress.py # 按今天显示","python year-progress.py --date 2026-11-02"],"category":"日期时间"},{"slug":"yes-no-oracle","name":"是非神谕","summary":"只回答 是 / 否 / 再问一次，并附赠一条随机胡扯的理由。","examples":["python yes-no-oracle.py \"该不该跳槽\"","python yes-no-oracle.py --seed 7 \"明天要不要早起\""],"category":"数学与统计"},{"slug":"zalgo-text","name":"火星文加料","summary":"给文字叠加杂乱变音符，生成 cursed 风格文字（Zalgo Text）。","examples":["python zalgo-text.py \"你好，世界\"","python zalgo-text.py -i high \"cursed text\""],"category":"文本处理"},{"slug":"zero-width-clean","name":"零宽/隐形字符清理工具","summary":"零宽/隐形字符清理工具。","examples":["python zero-width-clean.py -i input.txt -o clean.txt","cat suspicious.txt | python zero-width-clean.py --list"],"category":"文件与目录"},{"slug":"zip-integrity-test","name":"压缩包完整性测试","summary":"压缩包完整性测试","examples":["python zip-integrity-test.py ./archives # 扫描目录(不递归)","python zip-integrity-test.py ./archives -r # 递归扫描"],"category":"压缩打包"},{"slug":"zodiac-west","name":"西方星座查询（Western Zodiac by birth date）","summary":"西方星座查询（Western Zodiac by birth date）","examples":["python -I zodiac-west.py --date 2000-08-08","python -I zodiac-west.py # 列出各星座日期边界"],"category":"日期时间"}]</script>
<script>
"use strict";
var TOOLS = JSON.parse(document.getElementById("tools-data").textContent);
var state = { q: "", cat: "全部" };
var CAT_COLORS = ["#3b5bdb","#0e9f6e","#d97706","#dc2626","#7c3aed","#0891b2","#db2777","#65a30d","#ea580c","#4f46e5","#059669","#b45309","#64748b"];

function esc(s) {
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function renderChips() {
  // 分类计数（按数量降序排列）
  var counts = {};
  TOOLS.forEach(function(t){ counts[t.category] = (counts[t.category]||0)+1; });
  var cats = Object.keys(counts).sort(function(a,b){ return counts[b]-counts[a]; });
  var chipBox = document.getElementById("chips");
  var frag = document.createDocumentFragment();
  function chip(label, n) {
    var b = document.createElement("button");
    b.className = "chip" + (label === state.cat ? " active" : "");
    b.innerHTML = esc(label) + ' <span class="n">' + n + "</span>";
    b.onclick = function(){ state.cat = label; renderChips(); render(); };
    frag.appendChild(b);
  }
  chip("全部", TOOLS.length);
  cats.forEach(function(c){ chip(c, counts[c]); });
  chipBox.innerHTML = "";
  chipBox.appendChild(frag);
}
function buildIndex() {
  renderChips();
  // 头部统计
  var counts = {};
  TOOLS.forEach(function(t){ counts[t.category] = (counts[t.category]||0)+1; });
  document.getElementById("stats").innerHTML =
    "<span><b>" + TOOLS.length + "</b>收录工具</span>" +
    "<span><b>" + Object.keys(counts).length + "</b>功能分类</span>" +
    "<span><b>0</b>第三方依赖</span>";
}
function match(t) {
  if (state.cat !== "全部" && t.category !== state.cat) return false;
  if (!state.q) return true;
  var hay = (t.name + " " + t.slug + " " + t.summary + " " + t.examples.join(" ") + " " + t.category).toLowerCase();
  return state.q.toLowerCase().split(/\s+/).every(function(w){ return hay.indexOf(w) !== -1; });
}
function render() {
  var grid = document.getElementById("grid");
  var shown = TOOLS.filter(match);
  document.getElementById("count").textContent = "显示 " + shown.length + " / " + TOOLS.length;
  if (!shown.length) {
    grid.innerHTML = '<div class="empty"><b>🔍</b>没有匹配的工具 —— 换个关键词或分类试试</div>';
    return;
  }
  var html = "";
  shown.forEach(function(t, i) {
    var ex = t.examples.length
      ? '<div class="example"><pre>' + esc(t.examples.join("\n")) + "</pre>" +
        '<button class="copy" data-i="' + TOOLS.indexOf(t) + '">复制</button></div>'
      : '<div class="no-example">（docstring 未提供示例命令）</div>';
    var color = CAT_COLORS[Math.abs(hash(t.category)) % CAT_COLORS.length];
    html += '<article class="card">' +
      '<div class="top"><h3>' + esc(t.name) + '</h3><span class="cat-tag" style="color:' + color + ';background:' + color + '14">' + esc(t.category) + "</span></div>" +
      '<code class="slug">' + esc(t.slug) + "</code>" +
      '<p class="desc">' + (esc(t.summary) || "—") + "</p>" + ex + "</article>";
  });
  grid.innerHTML = html;
}
function hash(s) { var h = 0; for (var i = 0; i < s.length; i++) { h = (h*31 + s.charCodeAt(i)) | 0; } return h; }
document.getElementById("grid").addEventListener("click", function(e) {
  var btn = e.target.closest(".copy");
  if (!btn) return;
  var t = TOOLS[+btn.dataset.i];
  var text = t.examples.join("\n");
  function done() { btn.textContent = "已复制"; btn.classList.add("ok"); setTimeout(function(){ btn.textContent = "复制"; btn.classList.remove("ok"); }, 1400); }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function(){ fallback(); });
  else fallback();
  function fallback() {
    var ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta);
    ta.select(); try { document.execCommand("copy"); done(); } catch (err) {} document.body.removeChild(ta);
  }
});
var qInput = document.getElementById("q"), clearBtn = document.getElementById("clear");
qInput.addEventListener("input", function() {
  state.q = qInput.value.trim();
  clearBtn.style.display = state.q ? "block" : "none";
  render();
});
clearBtn.onclick = function(){ qInput.value = ""; state.q = ""; clearBtn.style.display = "none"; render(); qInput.focus(); };
document.addEventListener("keydown", function(e) {
  if (e.key === "/" && document.activeElement !== qInput) { e.preventDefault(); qInput.focus(); }
  if (e.key === "Escape" && document.activeElement === qInput) { qInput.value = ""; state.q = ""; clearBtn.style.display = "none"; render(); qInput.blur(); }
});
document.getElementById("foot").textContent = "由 scratch/build_index.py 扫描 tools/*.py 顶部 docstring 自动生成 · 纯静态页面，可直接双击打开";
buildIndex();
render();
</script>
</body>
</html>
